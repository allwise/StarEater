name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK (ANDROID_HOME), so the android module is included here.
      - name: Test and build
        run: ./gradlew core:test lwjgl3:dist android:assembleDebug --stacktrace

      - name: Desktop jar
        uses: actions/upload-artifact@v4
        with:
          name: StarEater-desktop
          path: lwjgl3/build/libs/*-desktop.jar

      - name: Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StarEater-android-debug
          path: android/build/outputs/apk/debug/*.apk
