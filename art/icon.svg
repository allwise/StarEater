<?xml version="1.0" encoding="UTF-8"?>
<!--
  Star Eater's icon: the whole game in three shapes, as a chase. The E (bottom left) streaks up after
  the o; the o (top) streaks down after the star (right). Who is after whom reads from the streaks.

  Drawn on Android's 108-unit adaptive-icon grid: launchers show the middle 72 units and may mask
  that down to a circle 66 across, so everything that matters sits inside that circle. The
  "background" group is the back layer and the "art" group the front one; tools/make_icons.cjs
  renders them separately for Android and together for everything else.

  Flat shapes only, no filters: it has to survive being 48 pixels wide.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <radialGradient id="sky" cx="54" cy="52" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2a66"/>
      <stop offset="0.55" stop-color="#0c1230"/>
      <stop offset="1" stop-color="#060914"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect width="108" height="108" fill="url(#sky)"/>
    <!-- A few far-off stars, out towards the corners where nothing else is. -->
    <g><rect x="66" y="22" width="1.3" height="1.3" fill="#7f8cb8"/>
    <rect x="80" y="30" width="1.1" height="1.1" fill="#7f8cb8"/>
    <rect x="86" y="46" width="1.4" height="1.4" fill="#4fe3ff"/>
    <rect x="60" y="86" width="1.2" height="1.2" fill="#7f8cb8"/>
    <rect x="82" y="74" width="1.1" height="1.1" fill="#7f8cb8"/>
    <rect x="24" y="40" width="1.2" height="1.2" fill="#7f8cb8"/>
    <rect x="28" y="26" width="1.0" height="1.0" fill="#4fe3ff"/>
    <rect x="54" y="70" width="1.0" height="1.0" fill="#7f8cb8"/>
    <rect x="88" y="84" width="1.2" height="1.2" fill="#7f8cb8"/>
    <rect x="40" y="90" width="1.1" height="1.1" fill="#4fe3ff"/>
    <rect x="72" y="90" width="1.0" height="1.0" fill="#7f8cb8"/>
    </g>
    <g fill="#7f8cb8">
      <rect x="20" y="24" width="1.6" height="1.6"/>
      <rect x="38" y="15" width="1.2" height="1.2"/>
      <rect x="88" y="62" width="1.6" height="1.6"/>
      <rect x="70" y="86" width="1.2" height="1.2"/>
      <rect x="14" y="52" width="1.2" height="1.2"/>
      <rect x="93" y="22" width="1.2" height="1.2"/>
      <rect x="46" y="94" width="1.6" height="1.6"/>
    </g>
    <g fill="#4fe3ff">
      <rect x="84" y="88" width="1.4" height="1.4"/>
      <rect x="12" y="84" width="1.4" height="1.4"/>
      <rect x="56" y="12" width="1.4" height="1.4"/>
    </g>
  </g>

  
  <g id="art">
    <line x1="29.8" y1="81.8" x2="27.6" y2="90.6" stroke="#ff4d5e" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
    <line x1="33.3" y1="82.7" x2="29.9" y2="96.3" stroke="#ff4d5e" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
    <line x1="36.8" y1="83.5" x2="35.1" y2="90.3" stroke="#ff4d5e" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
    <line x1="36.6" y1="31.1" x2="28.8" y2="26.3" stroke="#4fe3ff" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
    <line x1="34.7" y1="34.2" x2="22.8" y2="26.8" stroke="#4fe3ff" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
    <line x1="32.8" y1="37.3" x2="26.8" y2="33.6" stroke="#4fe3ff" stroke-width="2.4" stroke-linecap="round" opacity="0.35"/>
    <circle cx="73" cy="58" r="18" fill="#ffc533" opacity="0.13"/>
    <circle cx="73" cy="58" r="14.5" fill="#ffc533" opacity="0.16"/>
    <path fill="#ffc533" d="M73.00 46.00 L75.96 53.92 L84.41 54.29 L77.79 59.56 L80.05 67.71 L73.00 63.04 L65.95 67.71 L68.21 59.56 L61.59 54.29 L70.04 53.92 Z" transform="rotate(-8 73 58)"/>
    <circle cx="73" cy="58" r="2.4" fill="#fff6c9"/>
    <circle cx="44" cy="40" r="16" fill="#4fe3ff" opacity="0.12"/>
    <circle cx="44" cy="40" r="12.5" fill="#4fe3ff" opacity="0.18"/>
    <circle cx="44" cy="40" r="8" fill="#060914" stroke="#eafcff" stroke-width="4.6"/>
    <circle cx="36" cy="72" r="11.9" fill="#ff4d5e" opacity="0.14"/>
    <g fill="none" stroke="#ff4d5e" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round" transform="translate(36 72) rotate(-45) scale(1.08) translate(-31.5 -68)">
      <path d="M36.5 61 L27 61 L27 75 L36.5 75"/>
    <path d="M27 68 L34 68"/>
    </g>
  </g>
</svg>
